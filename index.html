<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Super Kart Grand Prix</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="shell">
  <div id="bezel">
    <canvas id="screen" width="256" height="224"></canvas>
    <div id="scanlines"></div>
  </div>
  <div id="legend">
    <span><b>&#8592;&#8594;</b> steer</span>
    <span><b>Z</b> accel</span>
    <span><b>X</b> brake</span>
    <span><b>C</b> hop / drift</span>
    <span><b>Shift</b> item</span>
    <span><b>Enter</b> start</span>
    <span><b>F</b> fullscreen</span>
    <span><b>H</b> HD Mode 7</span>
    <span><b>M</b> mute</span>
  </div>
</div>
<div id="boot">
  <div id="bootinner">
    <h1>SUPER KART<br><span>GRAND PRIX</span></h1>
    <p>A pixel-faithful, from-scratch Mode&nbsp;7 kart racer.</p>
    <button id="bootbtn">PRESS START</button>
    <small>Click to enable sound &amp; begin</small>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/palette.js"></script>
<script src="js/pixel.js"></script>
<script src="js/font.js"></script>
<script src="js/characters.js"></script>
<script src="js/art_kart.js"></script>
<script src="js/art_objects.js"></script>
<script src="js/art_ui.js"></script>
<script src="js/themes.js"></script>
<script src="js/trackgen.js"></script>
<script src="js/courses.js"></script>
<script src="js/arenas.js"></script>
<script src="js/mode7.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/touch.js"></script>
<script src="js/items.js"></script>
<script src="js/physics.js"></script>
<script src="js/ai.js"></script>
<script src="js/race.js"></script>
<script src="js/hud.js"></script>
<script src="js/menus.js"></script>
<script src="js/main.js"></script>
</body>
</html>
