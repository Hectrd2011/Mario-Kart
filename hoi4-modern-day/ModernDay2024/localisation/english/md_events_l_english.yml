l_english:
 md_usa.1.a:0 "Make America Great Again!"
 md_usa.1.t:0 "The Second Inauguration"
 md_usa.1.d:0 "On a freezing day in Washington, moved indoors to the Capitol Rotunda, Donald J. Trump takes the oath of office as the 47th President of the United States, the first since Grover Cleveland to win non-consecutive terms. \"The golden age of America begins right now,\" he declares."
 md_usa.30.a:0 "Leave the Belt and Road and give the US priority."
 md_usa.30.b:0 "The canal is Panamanian, and it will stay that way."
 md_usa.30.t:0 "American Demands on the Canal"
 md_usa.30.d:0 "Washington accuses Panama of letting China run the canal and threatens to \"take it back\". The President insists American warships must pass free of charge."
 md_usa.31.a:0 "Greenland is not for sale."
 md_usa.31.b:0 "Accept the American offer."
 md_usa.31.t:0 "An Offer for Greenland"
 md_usa.31.d:0 "The United States has made a formal offer to purchase Greenland. Nuuk and Copenhagen are united in outrage, but the President says that American ownership of Greenland is \"an absolute necessity\"."
 md_usa.32.a:0 "Elbows up. Never."
 md_usa.32.b:0 "Join the Union."
 md_usa.32.t:0 "The Fifty-First State"
 md_usa.32.d:0 "The American President has again suggested that Canada should become the fifty-first state, mocking the Prime Minister as \"Governor\". This time the offer is formal."
 md_usa.33.a:0 "Their loss."
 md_usa.33.t:0 "Denmark Refuses"
 md_usa.33.d:0 "Copenhagen has rejected our offer for Greenland, and European capitals have closed ranks behind Denmark."
 md_usa.34.a:0 "A great real estate deal!"
 md_usa.34.t:0 "Greenland Is Ours"
 md_usa.34.d:0 "Denmark has agreed to sell Greenland. The largest land purchase since Alaska."
 md_news.1.a:0 "A new era in Washington."
 md_news.1.t:0 "Trump Sworn In as 47th President"
 md_news.1.d:0 "Donald Trump has been inaugurated for a second term as President of the United States. Within hours he signed orders declaring a national emergency at the southern border, withdrawing from the Paris Agreement and pardoning the January 6th defendants. Allies and adversaries alike are bracing for four turbulent years."
 md_news.10.a:0 "Will it hold?"
 md_news.10.t:0 "Guns Fall Silent in Ukraine"
 md_news.10.d:0 "After almost three years of full-scale war, a ceasefire has come into force along the front line in Ukraine. Russia keeps the territory it holds; Kyiv insists it will never recognise the occupation. Few expect the peace to be permanent."
 md_news.30.a:0 "The Middle East will never be the same."
 md_news.30.t:0 "The Twelve-Day War"
 md_news.30.d:0 "Israel has launched waves of airstrikes against Iran's nuclear programme. Iran answered with hundreds of ballistic missiles. The United States joined in with bunker-busters on Fordow before a ceasefire took hold."
 md_news.20.a:0 "A new Syria."
 md_news.20.t:0 "Fall of the Assad Regime"
 md_news.20.d:0 "Fifty-four years of Assad family rule have ended. Rebel forces led by Hay'at Tahrir al-Sham have entered Damascus and Bashar al-Assad has fled to Moscow. Crowds topple statues of Hafez al-Assad as prisoners stream out of Sednaya."
 md_prc.10.a:0 "Taiwan's future is for Taiwanese to decide."
 md_prc.10.b:0 "Accept reunification."
 md_prc.10.t:0 "Beijing's Offer"
 md_prc.10.d:0 "Beijing proposes \"peaceful reunification\" under one country, two systems, with guarantees for Taiwan's economy and way of life. After Hong Kong, few in Taipei believe the guarantees."
 md_war.10.a:0 "Accept a ceasefire on the current lines."
 md_war.10.b:0 "Reject it. The operation continues."
 md_war.10.t:0 "An American Peace Plan"
 md_war.10.d:0 "The American envoys have arrived with a plan: a ceasefire along the current line of contact, sanctions relief, and no NATO membership for Ukraine. The Kremlin must decide."
 md_war.11.a:0 "Accept. Ukraine must survive."
 md_war.11.b:0 "Refuse. We will not reward aggression."
 md_war.11.t:0 "Moscow Offers a Ceasefire"
 md_war.11.d:0 "The Kremlin proposes a ceasefire along the current front line. Russian troops would keep the territory they hold."
 md_war.12.a:0 "Agree to a ceasefire."
 md_war.12.b:0 "Demand Ukraine withdraw from the annexed regions first."
 md_war.12.t:0 "Kyiv Proposes Talks"
 md_war.12.d:0 "Ukraine's delegation in Istanbul proposes an unconditional thirty-day ceasefire."
 md_war.13.a:0 "Sign the ceasefire."
 md_war.13.b:0 "Refuse to give up our land."
 md_war.13.t:0 "Moscow Accepts the American Plan"
 md_war.13.d:0 "Russia has accepted Washington's plan for a ceasefire on the current front line. Now it is up to Kyiv."
 md_isr.1.a:0 "Accept the ceasefire."
 md_isr.1.b:0 "Keep pushing north."
 md_isr.1.t:0 "Ceasefire with Hezbollah"
 md_isr.1.d:0 "American and French mediators have brokered a sixty-day ceasefire on the Lebanese border. Hezbollah would withdraw north of the Litani and the Lebanese army would deploy in the south."
 md_isr.2.a:0 "Deploy the army to the south."
 md_isr.2.t:0 "The Guns Fall Silent in the South"
 md_isr.2.d:0 "Israel has accepted the ceasefire. For the first time in over a year, there is quiet on the southern border."
 md_isr.10.a:0 "Sign the hostage deal."
 md_isr.10.b:0 "Refuse. The war goes on."
 md_isr.10.t:0 "Pressure for a Gaza Deal"
 md_isr.10.d:0 "Washington wants the war in Gaza ended and the hostages home. The coalition's far-right partners threaten to walk out if a deal is signed."
 md_isr.11.a:0 "Bring them home."
 md_isr.11.b:0 "Delay the deal."
 md_isr.11.t:0 "The Gaza Ceasefire"
 md_isr.11.d:0 "A three-phase ceasefire takes effect in Gaza. The first hostages are released in exchange for Palestinian prisoners."
 md_isr.20.a:0 "Normalise relations."
 md_isr.20.b:0 "Not without a Palestinian state."
 md_isr.20.t:0 "Normalisation with Israel?"
 md_isr.20.d:0 "Washington is pressing for Saudi-Israeli normalisation. Riyadh's price: a credible path to a Palestinian state."
 md_isr.30.a:0 "Strike now."
 md_isr.30.b:0 "Hold off."
 md_isr.30.t:0 "Operation Rising Lion"
 md_isr.30.d:0 "Intelligence says Iran is weeks from breakout. The air force is ready to strike the nuclear sites and the commanders of the Revolutionary Guard."
 md_per.1.a:0 "True Promise III: fire the missiles."
 md_per.1.b:0 "Absorb the blow."
 md_per.1.t:0 "Israel Strikes Iran"
 md_per.1.d:0 "Explosions at Natanz, Fordow and Isfahan. Senior IRGC commanders and nuclear scientists are dead."
 md_syr.1.a:0 "Launch the offensive."
 md_syr.1.b:0 "Wait."
 md_syr.1.t:0 "Operation Deterrence of Aggression"
 md_syr.1.d:0 "With Hezbollah gutted and Russia stretched thin, HTS and allied factions are ready to break out of Idlib and drive on Aleppo."
 md_syr.2.a:0 "The regime is finished."
 md_syr.2.b:0 "Fight to the last."
 md_syr.2.t:0 "Damascus Falls"
 md_syr.2.d:0 "Aleppo, Hama and Homs have fallen in days. The army has melted away. Bashar al-Assad has boarded a plane to Moscow."
 md_kor.1.a:0 "Declare martial law."
 md_kor.1.b:0 "Step back from the brink."
 md_kor.1.t:0 "Emergency Martial Law"
 md_kor.1.d:0 "Late at night President Yoon appears on television and declares emergency martial law, accusing the opposition of \"anti-state activities\". Troops are on their way to the National Assembly."
 md_kor.2.a:0 "Martial law is over."
 md_kor.2.t:0 "The Assembly Votes"
 md_kor.2.d:0 "Lawmakers climb the fences of the National Assembly. All 190 present vote to lift martial law. Six hours after declaring it, Yoon backs down."
 md_kor.3.a:0 "The constitution works."
 md_kor.3.t:0 "President Yoon Impeached"
 md_kor.3.d:0 "The National Assembly has impeached the President. Prime Minister Han Duck-soo becomes acting president."
 md_kor.4.a:0 "To the polls."
 md_kor.4.t:0 "Yoon Removed from Office"
 md_kor.4.d:0 "The Constitutional Court unanimously upholds the impeachment. A snap presidential election will be held in June."
 md_kor.5.a:0 "Congratulations, President Lee."
 md_kor.5.t:0 "Lee Jae-myung Wins the Presidency"
 md_kor.5.d:0 "The Democratic Party's Lee Jae-myung has won the snap election and is sworn in the next morning."
 md_ger.1.a:0 "Call a snap election."
 md_ger.1.t:0 "The Traffic Light Goes Out"
 md_ger.1.d:0 "Hours after the American result, Chancellor Scholz fires his finance minister Christian Lindner. The FDP quits the government and the traffic-light coalition is over. Scholz will face a confidence vote."
 md_ger.2.a:0 "Merz will form a government."
 md_ger.2.t:0 "The Federal Election"
 md_ger.2.d:0 "Germans have voted. The CDU/CSU comes first, the AfD doubles its vote to come second, and the SPD suffers its worst result since 1887."
 md_ger.3.a:0 "A new government for Germany."
 md_ger.3.t:0 "Chancellor Merz"
 md_ger.3.d:0 "After a historic failed first round, Friedrich Merz is elected Chancellor at the head of a CDU/CSU-SPD coalition."
 md_fra.1.a:0 "Appoint François Bayrou."
 md_fra.1.t:0 "Barnier Government Falls"
 md_fra.1.d:0 "The left and the Rassemblement National have voted together to censure Michel Barnier's government over the budget. It is the shortest-lived government of the Fifth Republic."
 md_can.1.a:0 "The race begins."
 md_can.1.t:0 "Trudeau Steps Down"
 md_can.1.d:0 "Facing a caucus revolt and collapsing polls, Justin Trudeau announces he will resign once the Liberals pick a new leader."
 md_can.2.a:0 "Elbows up."
 md_can.2.t:0 "Prime Minister Carney"
 md_can.2.d:0 "Former central banker Mark Carney wins the Liberal leadership by a landslide and is sworn in as Prime Minister."
 md_rom.1.a:0 "Rerun the election."
 md_rom.1.t:0 "The Election Is Annulled"
 md_rom.1.d:0 "The Constitutional Court has annulled the presidential election after declassified intelligence revealed a Russian-backed TikTok campaign behind the surprise first-round winner, Călin Georgescu."
 md_rom.2.a:0 "Romania stays in the West."
 md_rom.2.t:0 "Nicușor Dan Elected"
 md_rom.2.d:0 "Bucharest's mayor Nicușor Dan wins the rerun against the nationalist George Simion."
 md_geo.1.a:0 "Hold firm."
 md_geo.1.b:0 "Reopen the talks."
 md_geo.1.t:0 "EU Talks Suspended"
 md_geo.1.d:0 "The government has suspended EU accession talks until 2028. Tens of thousands march on parliament every night."
 md_hai.1.a:0 "A new prime minister."
 md_hai.1.t:0 "Conille Dismissed"
 md_hai.1.d:0 "The Transitional Presidential Council has fired Prime Minister Garry Conille and appointed businessman Alix Didier Fils-Aimé."
 md_ind.1.a:0 "A measured response."
 md_ind.1.t:0 "Operation Sindoor"
 md_ind.1.d:0 "Two weeks after the Pahalgam massacre, Indian missiles strike targets across Pakistan and Pakistani-administered Kashmir. Pakistan answers with drones and artillery along the Line of Control."
 md_leaders.1.a:0 "A new government."
 md_leaders.1.t:0 "Landslide in Mauritius"
 md_leaders.1.d:0 "The Alliance du Changement has won all sixty mainland seats. Navin Ramgoolam returns as Prime Minister."
 md_leaders.2.a:0 "A new government."
 md_leaders.2.t:0 "A Social Democrat Government"
 md_leaders.2.d:0 "After the October election, Gintautas Paluckas becomes Prime Minister at the head of a Social Democrat-led coalition."
 md_leaders.3.a:0 "A new government."
 md_leaders.3.t:0 "A Peaceful Handover in Hargeisa"
 md_leaders.3.d:0 "The opposition's Abdirahman Irro has won the presidential election and is sworn in."
 md_leaders.4.a:0 "A new government."
 md_leaders.4.t:0 "A New Government in Reykjavík"
 md_leaders.4.d:0 "Kristrún Frostadóttir of the Social Democratic Alliance becomes Iceland's youngest prime minister."
 md_leaders.5.a:0 "A new government."
 md_leaders.5.t:0 "Mahama Returns"
 md_leaders.5.d:0 "John Mahama of the NDC is sworn in after a landslide election victory."
 md_leaders.6.a:0 "A new government."
 md_leaders.6.t:0 "Lebanon Elects a President"
 md_leaders.6.d:0 "After over two years of vacancy, parliament elects army commander Joseph Aoun as President."
 md_leaders.7.a:0 "A new government."
 md_leaders.7.t:0 "President Chapo"
 md_leaders.7.d:0 "Daniel Chapo is sworn in amid deadly post-election protests."
 md_leaders.8.a:0 "A new government."
 md_leaders.8.t:0 "Bulgaria Finally Has a Government"
 md_leaders.8.d:0 "After seven elections in four years, Rosen Zhelyazkov of GERB forms a government."
 md_leaders.9.a:0 "A new government."
 md_leaders.9.t:0 "Taoiseach Martin"
 md_leaders.9.d:0 "Micheál Martin returns as Taoiseach in a Fianna Fáil-Fine Gael coalition."
 md_leaders.10.a:0 "A new government."
 md_leaders.10.t:0 "The Arizona Coalition"
 md_leaders.10.d:0 "Bart De Wever of the N-VA becomes Belgium's first Flemish nationalist prime minister."
 md_leaders.11.a:0 "A new government."
 md_leaders.11.t:0 "The Left Returns in Uruguay"
 md_leaders.11.d:0 "Yamandú Orsi of the Frente Amplio is sworn in as President."
 md_leaders.12.a:0 "A new government."
 md_leaders.12.t:0 "Chancellor Stocker"
 md_leaders.12.d:0 "After talks between the FPÖ and ÖVP collapse, Christian Stocker forms a three-party coalition."
 md_leaders.13.a:0 "A new government."
 md_leaders.13.t:0 "Namibia's First Woman President"
 md_leaders.13.d:0 "Netumbo Nandi-Ndaitwah is sworn in as President of Namibia."
 md_leaders.14.a:0 "A new government."
 md_leaders.14.t:0 "Japan's First Woman Prime Minister"
 md_leaders.14.d:0 "Sanae Takaichi becomes Prime Minister after Ishiba resigns over the LDP's election losses."
 md_dip.1.a:0 "Welcome them into the alliance."
 md_dip.1.b:0 "The alliance is not ready."
 md_dip.1.t:0 "A Request to Join NATO"
 md_dip.1.d:0 "[From.GetName] has formally applied to join the North Atlantic Treaty Organization."
 md_dip.2.a:0 "A historic day."
 md_dip.2.t:0 "Welcome to NATO"
 md_dip.2.d:0 "Our application has been accepted. We are now covered by Article Five."
 md_dip.3.a:0 "Disappointing."
 md_dip.3.t:0 "NATO Says Not Yet"
 md_dip.3.d:0 "The allies have turned down our application, for now."
