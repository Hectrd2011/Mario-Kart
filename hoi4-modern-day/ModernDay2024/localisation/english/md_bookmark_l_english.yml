l_english:
 MD_BOOKMARK_NAME:0 "The Second Term"
 MD_BOOKMARK_DESC:0 "6 November 2024. Donald Trump has won the American presidential election. Wars rage in Ukraine, Gaza, Lebanon and Sudan; Germany's government has just collapsed; and in three weeks the Assad regime will fall. The world is about to change."
 MD_BM_USA:0 "Donald Trump has won back the White House. Until 20 January a lame-duck Biden administration still holds power. Then: tariffs, DOGE, the border, and a promise to end the war in Ukraine in a day."
 MD_BM_PRC:0 "Xi Jinping's China faces a sluggish economy, a hostile Washington, and the 2027 deadline for a PLA ready to take Taiwan."
 MD_BM_RUS:0 "Nearly three years into the war, Russia is grinding forward in the Donbas, fighting off a Ukrainian incursion in Kursk, and hoping the new American president will hand it victory."
 MD_BM_ENG:0 "Keir Starmer's Labour government won a landslide in July but faces a fiscal black hole, a rising Reform UK and a world in turmoil."
 MD_BM_FRA:0 "With no majority in the Assembly, Macron's France lurches from budget crisis to budget crisis as the Rassemblement National waits for its moment."
 MD_BM_GER:0 "On the very day Trump wins, Olaf Scholz's traffic-light coalition collapses. Germany faces a snap election, a stagnant economy and a Bundeswehr that must be rebuilt."
 MD_BM_IND:0 "Narendra Modi's India is the world's most populous nation and fastest-growing major economy, courted by Washington and Moscow alike."
 MD_BM_UKR:0 "Ukraine holds out against the Russian invasion, holds a slice of Kursk, and fears that American aid is about to dry up."
 MD_BM_ISR:0 "Thirteen months after 7 October, Israel fights on seven fronts: Gaza, Lebanon, the West Bank, Syria, Iraq, Yemen and Iran."
 MD_BM_PER:0 "Iran's Axis of Resistance is reeling, its proxies battered and its air defences exposed. The nuclear question looms."
 MD_BM_JAP:0 "Shigeru Ishiba's LDP has just lost its majority. Japan is re-arming faster than at any time since 1945."
 MD_BM_KOR:0 "President Yoon Suk Yeol is unpopular and cornered by an opposition-controlled National Assembly..."
 MD_BM_ROC:0 "Lai Ching-te's Taiwan makes the world's most advanced chips and lives under the shadow of the PLA."
 MD_BM_TUR:0 "Erdoğan's Türkiye balances between NATO and Russia, and eyes an opportunity in Syria."
 MD_BM_POL:0 "Poland is building the largest army in Europe on NATO's eastern flank."
 MD_BM_SAU:0 "Mohammed bin Salman's kingdom pursues Vision 2030 and weighs normalisation with Israel."
 MD_BM_PRK:0 "Kim Jong Un has sent troops to fight for Russia in Kursk in return for technology and cash."
 MD_BM_BRA:0 "Lula's Brazil hosts BRICS and COP30 and seeks a voice for the Global South."
 MD_BM_SYR:0 "Bashar al-Assad's regime looks secure. In three weeks it will not exist."
